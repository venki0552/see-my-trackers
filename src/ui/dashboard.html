<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>See My Trackers: Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 20px; font-size: 14px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    #nav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    #nav a { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; }
    #nav a.active { color: var(--fg); border-color: var(--blue); }
    h1 { font-size: 22px; } h2 { font-size: 16px; margin-top: 24px; }
  </style>
</head>
<body>
  <header><img src="icons/icon-48.png" width="32" height="32" alt=""><b style="font-size:18px">See My Trackers</b></header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <script src="dashboard.js"></script>
</body>
</html>
