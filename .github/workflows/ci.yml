name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Release builds must not contain the test bridge
        run: test "$(grep -c testResult dist/chrome/relay.js || true)" = "0"
      - run: npx web-ext lint --source-dir dist/firefox --self-hosted
